name: identity_management

docstring: |
  A resource registry that stores identities of actors (users
  are an instance of actor) and resources, including bindings
  of internal identities to external identities. Also stores
  metadata such as user contact info.

dependencies: [resource_registry]

# TODO:
# - Move R1 operations into R2 framework

methods:
  # -----------------
  # Working with internal actor identities

  create_actor_identity:
    docstring: |
      Persists the provided ActorIdentity object. The id string returned
      is the internal id by which actors should be represented in message
      headers for policy enforcement, etc. 
    in:
      actor_identity: !ActorIdentity
    out:
      actor_id: ""
    throws:
      BadRequest: if object passed has _id or _rev attribute

  update_actor_identity:
    docstring: |
      Updates the provided ActorIdentity object.  Throws NotFound exception if
      an existing version of ActorIdentity is not found.  Throws Conflict if
      the provided ActorIdentity object is not based on the latest persisted
      version of the object.
    in:
      actor_identity: !ActorIdentity
    out:
    throws:
      BadRequest: if object does not have _id or _rev attribute
      NotFound: object with specified id does not exist
      Conflict: object not based on latest persisted object version

  read_actor_identity:
    docstring: |
      Returns the ActorIdentity object for the specified actor id.
      Throws exception if id does not match any persisted ActorIdentity
      objects.
    in:
      actor_id: ""
    out:
      actor_identity: !ActorIdentity
    throws:
      NotFound: object with specified id does not exist

  delete_actor_identity:
    docstring: |
      For now, permanently deletes ActorIdentity object with the specified
      id. Throws exception if id does not match any persisted ActorIdentity.
    in:
      actor_id: ""
    out:
    throws:
      NotFound: object with specified id does not exist

  find_actor_identity_by_name:
    docstring: |
      Return the ActorIdentity object whose name attribute matches the passed value.
    in:
      name: ""
    out:
      actor_info: !ActorIdentity
    throws:
      NotFound: failed to find ActorIdentity
      Inconsistent: Multiple ActorIdentity objects matched name
  # -----------------
  # Working with external identities

  register_actor_credentials:
    docstring: |
      Persists new ActorCredentials object. Then establishes an association
      with the ActorIdentity object identified by the passed actor id.
    in:
      actor_id: ""
      credentials: !ActorCredentials
    out:
    throws:
      BadRequest: if object passed has _id or _rev attribute or association creation fails
      NotFound: ActorIdentity object does not exist

  unregister_actor_credentials:
    docstring: |
      For now, permanently deletes the ActorCredential object with the
      specified name.  The association between the ActorCredential object
      and the ActorIdentity object indicated by the passed actor id is
      also deleted.
    in:
      actor_id: ""
      credentials_name: ""
    out:
    throws:
      NotFound: if ActorCredential or association do not exist

  # -----------------
  # Working with internal resource identities

  create_resource_identity:
    in:
      resource_identity: !ResourceIdentity
    out:
      resource_identity_id: ""

  update_resource_identity:
    in:
      resource_identity: !ResourceIdentity
    out:

  read_resource_identity:
    in:
      resource_identity_id: ""
    out:
      resource_identity: !ResourceIdentity

  delete_resource_identity:
    in:
      resource_identity_id: ""
    out:

  # -----------------
  # Utility methods
  
  signon:
    docstring: |
      Validates the certificate. If legit, extracts the subject line and searches
      all ActorCredentials objects looking for a match.
      - If found, a lookup is performed on the association to the ActorIdentity object.
      If found, a check is made to see if the actor contact info is non-null.
      The ActorIdentity object id is returned along with the boolean True to indicate
      whether contact info was found (this is a known user who has registered).
      - If not found, a new ActorIdentity object is created, a new ActorCredentials
      object is create, and an association is established between the two. The object
      id of the ActorIdentity object is returned with the boolean False to indicate
      this is a new user who needs to register contact info.
    in:
      certificate: ""
      ignore_date_range: False
    out:
      actor_id: ""
      valid_til: ""
      registered: False      
    throws:
      BadRequest: if certificate is not valid
      NotFound: Something bad happened in the registry such that an object or association got lost
      ServerError: More than one ActorCredentials object was associated with the certificate subject

  update_actor_contact_info:
    docstring: |
      Helper method to attach contact info to ActorIdentity object identified
      by the passed actor (user) id.  The ActorIdentity is first read, the
      contact info is applied to the object and the object is updated in the
      datastore.
    in:
      actor_id: ""
      contact_info: !ContactInformation
    out:
    throws:
      NotFound: ActorIdentity object does not exist
