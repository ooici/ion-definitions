# Instrument Management Service interface definition

# TODO:

name: instrument_management_service
dependencies: [resource_registry]
methods:



  # -----------------
  # Working with Instrument Driver (type) resources

  create_instrument_driver:
    in:
      instrument_driver_info: !InstrumentDriver
    out:
      instrument_driver_id: ""

  update_instrument_driver:
    in:
      instrument_driver_id: ""
      instrument_driver_info: !InstrumentDriver
    out:
      success: True

  read_instrument_driver:
    in:
      instrument_driver_id: ""
    out:
      instrument_driver_info: !InstrumentDriver

  delete_instrument_driver:
    in:
      instrument_driver_id: ""
      reason:               ""
    out:
      success: True

  find_instrument_driver:
    in:
      filters: !ResourceFilter
    out:
      instrument_driver_info_list: []



  # -----------------
  # Working with Instrument Model (type) resources

  create_instrument_model:
    in:
      instrument_model_info: !InstrumentModel
    out:
      instrument_model_id: ""

  update_instrument_model:
    in:
      instrument_model_id: ""
      instrument_model_info: !InstrumentModel
    out:
      success: True

  read_instrument_model:
    in:
      instrument_model_id: ""
    out:
      instrument_model_info: !InstrumentModel

  delete_instrument_model:
    in:
      instrument_model_id: ""
      reason:              ""
    out:
      success: True

  find_instrument_model:
    in:
      filters: !ResourceFilter
    out:
      instrument_model_info_list: []





  # -----------------
  # Working with Physical Instrument resources

  create_instrument_device:
    in:
      instrument_device_info: !InstrumentDevice
    out:
      instrument_device_id: ""

  update_instrument_device:
    in:
      instrument_device_id: ""
      instrument_device_info: !InstrumentDevice
    out:
      success: True

  read_instrument_device:
    in:
      instrument_device_id: ""
    out:
      instrument_device_info: !InstrumentDevice

  delete_instrument_device:
    in:
      instrument_device_id: ""
      reason:               ""
    out:
      success: True

  find_instrument_device:
    in:
      filters: !ResourceFilter
    out:
      instrument_device_info_list: []


  assign_instrument_device:
    in:
      instrument_id: ""
      instrument_device_id: ""
    out:
      success: True

  unassign_instrument_device:
    in:
      instrument_id: ""
      instrument_device_id: ""
    out:
      success: True

  activate_instrument_device:
    in:
      instrument_device_id: ""
    out:
      success: True





  # -----------------
  # Working with Physical Instrument resources

  create_instrument:
    in:
      instrument_info: !Instrument
    out:
      instrument_id: ""

  update_instrument:
    in:
      instrument_id: ""
      instrument_info: !Instrument
    out:
      success: True

  read_instrument:
    in:
      instrument_id: ""
    out:
      instrument_info: !Instrument

  delete_instrument:
    in:
      instrument_id: ""
      reason:        ""
    out:
      success: True

  find_instrument:
    in:
      filters: !ResourceFilter
    out:
      instrument_info_list: []


  assign_instrument:
    in:
      instrument_id:        ""
      instrument_device_id: ""
    out:
      success: True

  unassign_instrument:
    in:
      instrument_id:        ""
      instrument_device_id: ""
    out:
      success: True

  activate_instrument:
    in:
      instrument_id: ""
    out:
      success: True








  # -----------------
  # Working with Instrument Agent (type) resources

  create_instrument_agent:
    in:
      instrument_agent_info: !InstrumentAgent
    out:
      instrument_agent_id: ""

  update_instrument_agent:
    in:
      instrument_agent_id: ""
      instrument_agent_info: !InstrumentAgent
    out:
      success: True

  read_instrument_agent:
    in:
      instrument_agent_id: ""
    out:
      instrument_agent_info: !InstrumentAgent

  delete_instrument_agent:
    in:
      instrument_agent_id: ""
      reason:              ""
    out:
      success: True

  find_instrument_agent:
    in:
      filters: !ResourceFilter
    out:
      instrument_agent_info_list: []

  assign_instrument_agent:
    in:
      instrument_agent_id: ""
      instrument_id: ""
      instrument_agent_instance: !InstrumentAgentInstance
    out:
      success: True

  unassign_instrument_agent:
    in:
      instrument_agent_id: ""
      instrument_id: ""
    out:
      success: True



  # -----------------
  # Working with Platform resources

  create_platform:
    in:
      platform_info: !Platform
    out:
      platform_id: ""

  update_platform:
    in:
      platform_id: ""
      platform_info: !Platform
    out:
      success: True

  read_platform:
    in:
      platform_id: ""
    out:
      platform_info: !Platform

  delete_platform:
    in:
      platform_id: ""
      reason:      ""
    out:
      success: True

  find_platform:
    in:
      filters: !ResourceFilter
    out:
      platform_info_list: []

  # -----------------
  # Working with Platform Agent (type) resources

  create_platform_agent:
    in:
      platform_agent_info: !PlatformAgent
    out:
      platform_agent_id: ""

  update_platform_agent:
    in:
      platform_agent_id: ""
      platform_agent_info: !PlatformAgent
    out:
      success: True

  read_platform_agent:
    in:
      platform_agent_id: ""
    out:
      platform_agent_info: !PlatformAgent

  delete_platform_agent:
    in:
      platform_agent_id: ""
      reason:            ""
    out:
      success: True

  find_platform_agent:
    in:
      filters: !ResourceFilter
    out:
      platform_agent_info_list: []

  assign_platform_agent:
    in:
      platform_agent_id: ""
      platform_id: ""
      platform_agent_instance: !PlatformAgentInstance
    out:
      success: True

  unassign_agent:
    in:
      platform_agent_id: ""
      platform_id: ""
    out:
      success: True
